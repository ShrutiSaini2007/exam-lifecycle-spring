spring:
  datasource:
    url: jdbc:h2:mem:exam_lifecycle;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: test-only-secret-key-not-for-production-use-32bytes-min
    expiry-hours: 8
  bootstrap-admin-password: test-admin-pw123
